[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coastsnap-align"
version = "0.1.0"
description = "Masked, extensible image registration and comparison for CoastSnap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5", "Pillow>=10", "matplotlib>=3.9"]

[project.optional-dependencies]
matchers = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightglue @ git+https://github.com/cvg/LightGlue.git@5a650c444718caffc2669dc0094cde908f42dd73",
  "flexglue @ git+https://github.com/cvg/FlexGlue.git@99920296d082c9405ebfd612d674efe288e74881",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
coastsnap-align = "coastsnap_align.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
